apiVersion: v1
kind: ConfigMap
metadata:
  name: agenthub-config
  namespace: agenthub
data:
  APP_NAME: "AgentHub"
  DEBUG: "false"
  ENVIRONMENT: "production"
  # Set to the direct ingress-controller peer IPs or service CIDRs.
  TRUSTED_PROXY_IPS: ""
  LLM_BASE_URL: "https://api.deepseek.com/v1"
  LLM_MODEL: "deepseek-chat"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_FROM: "agenthub@example.com"
