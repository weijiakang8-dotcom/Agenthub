# 示例 Secret，仅供本地参考，请勿提交真实密钥。
# 推荐使用 External Secrets Operator 或 scripts/create-k8s-secret.sh 从本地 .env 创建。
apiVersion: v1
kind: Secret
metadata:
  name: agenthub-secrets
  namespace: agenthub
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+asyncpg://postgres:change-me@postgres:5432/agenthub
  REDIS_URL: redis://redis:6379/0
  OPENAI_API_KEY: sk-xxx
  ADMIN_API_KEY: ""
  TAVILY_API_KEY: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
