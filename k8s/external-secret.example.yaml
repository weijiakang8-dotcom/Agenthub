# 需要先安装 External Secrets Operator，并配置对应的 SecretStore。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agenthub-secrets
  namespace: agenthub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agenthub-secret-store
    kind: SecretStore
  target:
    name: agenthub-secrets
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: agenthub/openai-api-key
    - secretKey: DATABASE_URL
      remoteRef:
        key: agenthub/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: agenthub/redis-url
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: agenthub/smtp-password
