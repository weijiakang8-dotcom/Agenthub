apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: agenthub
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agenthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: migrate
          image: weijiakang/agenthub-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: agenthub-config
            - secretRef:
                name: agenthub-secrets
      containers:
        - name: api
          image: weijiakang/agenthub-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agenthub-config
            - secretRef:
                name: agenthub-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: agenthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: worker
          image: weijiakang/agenthub-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.engine.tasks", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: agenthub-config
            - secretRef:
                name: agenthub-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: agenthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: beat
          image: weijiakang/agenthub-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.engine.tasks", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: agenthub-config
            - secretRef:
                name: agenthub-secrets
