name: agenthub-staging

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agenthub_staging
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenthub_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agenthub_staging
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: staging
      OPENAI_FALLBACK_ENABLED: ${OPENAI_FALLBACK_ENABLED:-false}
    env_file:
      - ../.env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.engine.tasks.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
      - -B
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agenthub_staging
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: staging
    env_file:
      - ../.env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  staging_postgres_data:
