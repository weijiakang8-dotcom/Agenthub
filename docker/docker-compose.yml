services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agenthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agenthub}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenthub-network

  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenthub-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: agenthub-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - agenthub-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: agenthub-backend
    restart: unless-stopped
    environment:
      BUILD_SHA: ${BUILD_SHA:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenthub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-agenthub}
      REDIS_URL: redis://redis:6379/0
      # 本地 .env 设置 SMTP_HOST=mailhog；生产 .env 留空即走 Resend
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-agenthub@local}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_BASE_URL: http://embedding:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      HF_ENDPOINT: https://hf-mirror.com
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - agenthub-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_ICP_BEIAN_NUMBER: ${VITE_ICP_BEIAN_NUMBER:-鄂ICP备2026044084号-1}
    container_name: agenthub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - agenthub-network

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: agenthub-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.engine.tasks.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
      - -B
    environment:
      BUILD_SHA: ${BUILD_SHA:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenthub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-agenthub}
      REDIS_URL: redis://redis:6379/0
      # 本地 .env 设置 SMTP_HOST=mailhog；生产 .env 留空即走 Resend
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-agenthub@local}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_BASE_URL: http://embedding:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      HF_ENDPOINT: https://hf-mirror.com
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding:
        condition: service_started
    networks:
      - agenthub-network

  embedding:
    image: ollama/ollama:0.11.10
    container_name: agenthub-embedding
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - agenthub-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.148.0
    container_name: agenthub-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
    networks:
      - agenthub-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: agenthub-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - agenthub-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: agenthub-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - agenthub-network
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    container_name: agenthub-jaeger
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:14250:14250"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - agenthub-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  agenthub-network:
    driver: bridge
