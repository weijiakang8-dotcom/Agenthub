[package]
name = "synplex-agenthub"
version = "1.0.0"
description = "Synplex AgentHub desktop client"
authors = ["魏家康"]
edition = "2021"

[lib]
name = "synplex_agenthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
