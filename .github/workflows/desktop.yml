name: Desktop Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/src-tauri/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/.env.desktop"
      - ".github/workflows/desktop.yml"

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build macOS desktop client
        working-directory: frontend
        run: npm run desktop:build
      - name: Verify app bundle
        run: |
          test -d "frontend/src-tauri/target/release/bundle/macos/Synplex AgentHub.app"
          test -f "frontend/src-tauri/target/release/bundle/dmg/Synplex AgentHub_1.0.0_aarch64.dmg"
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synplex-agenthub-macos-arm64
          path: |
            frontend/src-tauri/target/release/bundle/macos/Synplex AgentHub.app
            frontend/src-tauri/target/release/bundle/dmg/Synplex AgentHub_1.0.0_aarch64.dmg
          retention-days: 14
