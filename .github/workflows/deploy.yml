name: Deploy AgentHub

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.112.130.181
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/agenthub
            bash deploy/production-deploy.sh
            docker image prune -f || true

      - name: Wait and verify health
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://synplex.xyz/api/not-a-real-route || true
          curl -sSI https://synplex.xyz/ | grep -iE 'x-frame-options|x-content-type-options' | head -2
