name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agenthub_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-secret-key-with-at-least-32-characters
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: ci@agenthub.local
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenthub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenthub_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install test dependency
        run: pip install pytest
      - name: Migrate database to head
        working-directory: backend
        run: alembic upgrade head
      - name: Seed model configs
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from app.database import async_session_factory
          from app.models import ModelConfig

          async def main():
              async with async_session_factory() as session:
                  existing = list((await session.execute(
                      select(ModelConfig).where(ModelConfig.organization_id.is_(None))
                  )).scalars().all())
                  if existing:
                      print(f"model configs already present: {len(existing)}")
                      return
                  session.add_all([
                      ModelConfig(
                          name="deepseek-v4-flash", provider="deepseek",
                          base_url="https://api.deepseek.com/v1", api_key="ci-placeholder",
                          model="deepseek-v4-flash", max_tokens=4096,
                          cost_per_1k_tokens=0.001, is_active=True, is_default=True,
                      ),
                      ModelConfig(
                          name="deepseek-v4-pro", provider="deepseek",
                          base_url="https://api.deepseek.com/v1", api_key="ci-placeholder",
                          model="deepseek-v4-pro", max_tokens=8192,
                          cost_per_1k_tokens=0.002, is_active=True, is_default=False,
                      ),
                  ])
                  await session.commit()

          asyncio.run(main())
          PY
      - name: Lint and format check
        working-directory: backend
        run: |
          python -m ruff check app tests alembic
          python -m black --check app tests
      - name: Compile and import smoke test
        working-directory: backend
        run: |
          python -m compileall app
          python -c "from app.main import app; assert app.title == 'AgentHub API'"
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint and format check
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm run test:run

  e2e:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agenthub_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-secret-key-with-at-least-32-characters
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenthub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenthub_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Migrate database to head
        working-directory: backend
        run: alembic upgrade head
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null; then
              echo "backend-ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"; cat /tmp/backend.log; exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t agenthub-backend:ci .
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t agenthub-frontend:ci .

  benchmark-gate:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agenthub_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-secret-key-with-at-least-32-characters
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: ci@agenthub.local
      AGENTHUB_OBSERVABILITY_DISABLED: "false"
      CI_P95_LATENCY_MS_LIMIT: "1500"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenthub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenthub_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Migrate to head
        working-directory: backend
        run: alembic upgrade head
      - name: Seed model configs
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from app.database import async_session_factory
          from app.models import ModelConfig

          async def main():
              async with async_session_factory() as session:
                  existing = list((await session.execute(
                      select(ModelConfig).where(ModelConfig.organization_id.is_(None))
                  )).scalars().all())
                  if existing:
                      print(f"model configs already present: {len(existing)}")
                      return
                  session.add_all([
                      ModelConfig(
                          name="deepseek-v4-flash", provider="deepseek",
                          base_url="https://api.deepseek.com/v1", api_key="ci-placeholder",
                          model="deepseek-v4-flash", max_tokens=4096,
                          cost_per_1k_tokens=0.001, is_active=True, is_default=True,
                      ),
                      ModelConfig(
                          name="deepseek-v4-pro", provider="deepseek",
                          base_url="https://api.deepseek.com/v1", api_key="ci-placeholder",
                          model="deepseek-v4-pro", max_tokens=8192,
                          cost_per_1k_tokens=0.002, is_active=True, is_default=False,
                      ),
                  ])
                  await session.commit()

          asyncio.run(main())
          PY
      - name: Full backend suite (functional gate)
        working-directory: backend
        run: pytest -q
      - name: Phase 0 benchmark harness (deterministic, no real model)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agenthub_benchmark_p0
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/postgres"
              )
              await conn.execute("CREATE DATABASE agenthub_benchmark_p0")
              await conn.close()

          asyncio.run(main())
          PY
          alembic -x db_url="$DATABASE_URL" upgrade head
          python -m pytest tests/benchmark/test_phase0_benchmark.py -q
      - name: Core latency gate
        working-directory: backend
        run: python ../scripts/ci_latency_gate.py
